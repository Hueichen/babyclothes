<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBF6F3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1C1719" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="買衣攻略">
  <title>寶寶買衣攻略器</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👶</text></svg>">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <!-- ================= Login ================= -->
  <section id="login-screen" class="login" hidden>
    <div class="login-inner">
      <div class="login-mark" aria-hidden="true">👶</div>
      <h1 class="login-title">寶寶買衣攻略器</h1>
      <p class="login-lead">用寶寶實穿過的紀錄，<br>挑出「不用反折」的那一號。</p>
      <div id="gsi-button" class="gsi-slot"></div>
      <p id="login-msg" class="login-msg" role="alert"></p>
      <p class="login-fine">僅限受邀的 Google 帳號使用</p>
    </div>
  </section>

  <!-- ================= App ================= -->
  <div id="app" class="app" hidden>
    <header class="topbar">
      <h1 id="page-title" class="topbar-title">幫選尺寸</h1>
      <button id="user-btn" class="avatar-btn" type="button" aria-label="帳號">
        <img id="user-avatar" alt="" referrerpolicy="no-referrer">
        <span id="user-initial"></span>
      </button>
    </header>

    <main class="main">

      <!-- ---------- 幫選尺寸 ---------- -->
      <section class="page" data-page="decide">
        <div class="card">
          <h2 class="card-title">這件衣服</h2>
          <div class="grid-2">
            <label class="field"><span>品牌</span>
              <input id="dc-brand" placeholder="例如：Lativ" autocomplete="off">
            </label>
            <label class="field"><span>類型</span>
              <select id="dc-category" class="js-cat-select"></select>
            </label>
          </div>
        </div>

        <div class="card">
          <div class="card-head">
            <h2 class="card-title">尺寸表</h2>
            <span id="dc-count" class="card-meta"></span>
          </div>
          <div class="btn-row">
            <button id="dc-photo" class="btn btn-tonal" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
              拍照解析
            </button>
            <button id="dc-add" class="btn btn-outline" type="button">＋ 手動新增</button>
          </div>
          <input id="dc-file" class="sr-file" type="file" accept="image/*">
          <div id="dc-cards" class="size-cards"></div>
        </div>

        <button id="dc-run" class="btn btn-primary btn-block btn-lg" type="button">幫我選尺寸</button>
        <div id="dc-result"></div>
      </section>

      <!-- ---------- 新增回饋 ---------- -->
      <section class="page" data-page="feedback" hidden>
        <div class="card card-quiet">
          <div class="card-head">
            <h2 class="card-title">從尺寸表照片帶入 <small>選填</small></h2>
          </div>
          <button id="fb-photo" class="btn btn-tonal btn-block" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
            拍照 / 選照片
          </button>
          <input id="fb-file" class="sr-file" type="file" accept="image/*">
          <div id="fb-pick" class="pick-sizes" hidden>
            <p class="hint">點一個尺寸，把它的數值帶進下方表單：</p>
            <div id="fb-pick-chips" class="chip-row"></div>
          </div>
        </div>

        <div class="card">
          <h2 class="card-title">買了哪一件</h2>
          <div class="grid-2">
            <label class="field"><span>品牌 <i>*</i></span>
              <input id="fb-brand" placeholder="例如：Lativ" autocomplete="off">
            </label>
            <label class="field"><span>類型</span>
              <select id="fb-category" class="js-cat-select"></select>
            </label>
            <label class="field"><span>尺寸 <i>*</i></span>
              <input id="fb-size" placeholder="例如：90" autocomplete="off">
            </label>
            <label class="field"><span>穿時月齡</span>
              <input id="fb-age" type="number" inputmode="numeric" min="0" step="1" placeholder="例如：17">
            </label>
            <label class="field span-2"><span>品項描述</span>
              <input id="fb-catdes" placeholder="例如：長袖上衣、牛仔褲" autocomplete="off">
            </label>
            <label class="field span-2"><span>款式 / 花色</span>
              <input id="fb-style" placeholder="例如：大象圖案" autocomplete="off">
            </label>
          </div>
        </div>

        <div class="card">
          <div class="card-head">
            <h2 class="card-title">尺寸數值</h2>
            <span class="card-meta">cm・選填</span>
          </div>
          <div id="fb-measures" class="measure-grid"></div>
        </div>

        <div class="card">
          <h2 class="card-title">穿起來如何</h2>
          <div id="fb-fit-chips" class="chip-row"></div>
          <label class="field"><span>描述</span>
            <textarea id="fb-fit" rows="2" placeholder="例如：袖子稍長但不用反折"></textarea>
          </label>
        </div>

        <button id="fb-save" class="btn btn-primary btn-block btn-lg" type="button">儲存這筆紀錄</button>
      </section>

      <!-- ---------- 寶寶體型 ---------- -->
      <section class="page" data-page="body" hidden>
        <div class="card">
          <h2 class="card-title">新增一次測量</h2>
          <div class="grid-2">
            <label class="field"><span>測量日期</span>
              <input id="bd-date" type="date">
            </label>
            <label class="field"><span>月齡</span>
              <input id="bd-age" type="number" inputmode="numeric" min="0" step="1" placeholder="例如：17">
            </label>
            <label class="field"><span>身高 cm <i>*</i></span>
              <input id="bd-height" type="number" inputmode="decimal" step="0.1" placeholder="85.5">
            </label>
            <label class="field"><span>體重 kg <i>*</i></span>
              <input id="bd-weight" type="number" inputmode="decimal" step="0.1" placeholder="12.5">
            </label>
            <label class="field span-2"><span>備註</span>
              <input id="bd-note" placeholder="選填" autocomplete="off">
            </label>
          </div>
          <button id="bd-save" class="btn btn-primary btn-block" type="button">儲存</button>
        </div>

        <div class="section-head">
          <h2>歷史紀錄</h2>
          <button id="bd-reload" class="btn btn-text" type="button">重新整理</button>
        </div>
        <div id="bd-list" class="list"></div>
      </section>

      <!-- ---------- 穿著紀錄 ---------- -->
      <section class="page" data-page="records" hidden>
        <div class="filter-bar">
          <div class="search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
            <input id="rc-q" type="search" placeholder="搜尋品牌、品項、款式" autocomplete="off">
          </div>
          <select id="rc-cat" aria-label="類型篩選"></select>
        </div>
        <div class="section-head">
          <span id="rc-count" class="card-meta"></span>
          <button id="rc-reload" class="btn btn-text" type="button">重新整理</button>
        </div>
        <div id="rc-list" class="list"></div>
      </section>
    </main>

    <nav class="tabbar" aria-label="主要功能">
      <a href="#decide" data-tab="decide">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.2 5.3L20 9l-4.4 3.8L17 18.5 12 15.5 7 18.5l1.4-5.7L4 9l5.8-.7z"/></svg>
        <span>幫選</span>
      </a>
      <a href="#feedback" data-tab="feedback">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4l-4 3 2 4 2-1v10h8V10l2 1 2-4-4-3c-.5 1.5-2 2.5-4 2.5S8.5 5.5 8 4z"/></svg>
        <span>回饋</span>
      </a>
      <a href="#body" data-tab="body">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M7 7h3M7 11h4M7 15h3"/></svg>
        <span>體型</span>
      </a>
      <a href="#records" data-tab="records">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5z"/><path d="M8.5 8.5h7M8.5 12h7M8.5 15.5h4"/></svg>
        <span>紀錄</span>
      </a>
    </nav>
  </div>

  <!-- 帳號面板 -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-name">
      <div class="sheet-grip"></div>
      <div class="sheet-user">
        <img id="sheet-avatar" alt="" referrerpolicy="no-referrer">
        <div>
          <div id="sheet-name" class="sheet-name"></div>
          <div id="sheet-email" class="sheet-email"></div>
        </div>
      </div>
      <button id="btn-ping" class="btn btn-outline btn-block" type="button">測試伺服器連線</button>
      <button id="btn-logout" class="btn btn-danger btn-block" type="button">登出</button>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="assets/app.js"></script>
</body>
</html>
